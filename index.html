<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D: Cilindro Circular Recto + Cono Superior</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Custom rainbow colorbar styling matching MATLAB style */
        .colorbar-gradient {
            background: linear-gradient(to top, 
                #30009c 0%, 
                #1840ff 16.6%, 
                #00b0ff 33.3%, 
                #00e676 50%, 
                #ffea00 66.6%, 
                #ff6d00 83.3%, 
                #d50000 100%);
        }
    </style>
</head>
<body class="bg-white text-slate-800 relative w-screen h-screen overflow-hidden">

    <!-- Container for Canvas -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- UI Overlay: Main Header Title -->
    <div class="absolute top-4 left-6 z-10 pointer-events-none">
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 tracking-tight bg-white/80 backdrop-blur-md px-4 py-2 rounded-lg border border-slate-200 shadow-sm">
            Modelo 3D: Cilindro Circular Recto + Cono Superior
        </h1>
        <p class="text-xs text-slate-500 mt-1 pl-1">Arrastra para rotar • Rueda para zoom • Clic derecho para desplazar</p>
    </div>

    <!-- UI Overlay: Legend Box (Top Right, matching image) -->
    <div class="absolute top-4 right-20 md:right-24 z-10 bg-white/95 border border-slate-300 rounded-md p-3 shadow-md min-w-[130px]">
        <div class="flex items-center gap-2 mb-2">
            <span class="w-5 h-4 inline-block bg-[#0072BD] border border-slate-400 rounded-sm"></span>
            <span class="text-sm font-medium text-slate-700">Cilindro</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-5 h-4 inline-block bg-[#D9531E] border border-slate-400 rounded-sm"></span>
            <span class="text-sm font-medium text-slate-700">Cono</span>
        </div>
    </div>

    <!-- UI Overlay: Vertical Colorbar Gradient (Far Right) -->
    <div class="absolute right-4 top-1/2 -translate-y-1/2 z-10 flex items-center h-[65vh] bg-white/90 p-2 rounded-lg border border-slate-200 shadow-sm">
        <div class="h-full flex flex-col justify-between text-xs font-semibold text-slate-600 mr-2 select-none">
            <span>7</span>
            <span>6</span>
            <span>5</span>
            <span>4</span>
            <span>3</span>
            <span>2</span>
            <span>1</span>
            <span>0</span>
        </div>
        <div class="w-6 h-full border border-slate-400 rounded-sm colorbar-gradient shadow-inner"></div>
    </div>

    <!-- Interactive Controls Bar -->
    <div class="absolute bottom-4 left-6 z-10 flex gap-2">
        <button id="btn-reset" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium px-3 py-2 rounded-md shadow transition">
            Restablecer Vista
        </button>
        <button id="btn-wireframe" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-medium px-3 py-2 rounded-md shadow transition">
            Alternar Malla
        </button>
        <button id="btn-rotate" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-medium px-3 py-2 rounded-md shadow transition">
            Auto-Rotación
        </button>
    </div>

    <script>
        // --- 3D Scene Initialization ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Initial Camera Position (Matching the perspective of the reference image)
        camera.position.set(11, 10, 12);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 3.5); // Center orbit around Z=3.5 center of height
        controls.update();

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(10, 15, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight2.position.set(-10, 10, -10);
        scene.add(dirLight2);

        // --- Geometric Parameters ---
        // Coordinates alignment:
        // Math Z axis (0 to 7) -> Three.js Y axis
        // Math X axis (-1 to 2) -> Three.js X axis
        // Math Y axis (-1 to 2) -> Three.js Z axis
        const radius = 1.5;
        const cylHeight = 4.0;
        const coneHeight = 3.0;

        // Group to hold all mesh & plot elements
        const plotGroup = new THREE.Group();
        scene.add(plotGroup);

        // 1. Cylinder Mesh (Cilindro - Blue)
        // MATLAB classic blue color: #0072BD
        const cylGeometry = new THREE.CylinderGeometry(radius, radius, cylHeight, 64, 1, false);
        const cylMaterial = new THREE.MeshStandardMaterial({
            color: 0x0072BD,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const cylinder = new THREE.Mesh(cylGeometry, cylMaterial);
        // In Three.js cylinder is centered at origin. Move center to Y = 2.0 (so bottom is Y=0, top is Y=4)
        cylinder.position.y = cylHeight / 2;
        plotGroup.add(cylinder);

        // 2. Cone Mesh (Cono - Orange)
        // MATLAB classic orange color: #D9531E
        const coneGeometry = new THREE.CylinderGeometry(0, radius, coneHeight, 64, 1, false);
        const coneMaterial = new THREE.MeshStandardMaterial({
            color: 0xD9531E,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        // Base of cone at Y=4.0, height=3.0, so center is at Y = 4.0 + 1.5 = 5.5
        cone.position.y = cylHeight + (coneHeight / 2);
        plotGroup.add(cone);

        // Add fine edge outlines for realistic CAD / MATLAB rendering
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x003366, linewidth: 1, transparent: true, opacity: 0.4 });
        
        // Base rim line
        const baseCircleGeom = new THREE.BufferGeometry().setFromPoints(
            new THREE.Path().absarc(0, 0, radius, 0, Math.PI * 2, true).getPoints(64)
        );
        const baseLine = new THREE.LineLoop(baseCircleGeom, edgeMaterial);
        baseLine.rotation.x = Math.PI / 2;
        baseLine.position.y = 0;
        plotGroup.add(baseLine);

        // Junction rim line (Z=4)
        const junctionLine = baseLine.clone();
        junctionLine.position.y = cylHeight;
        plotGroup.add(junctionLine);

        // --- Custom MATLAB Style Grid & Axes Box ---
        const boxXMin = -2, boxXMax = 2;
        const boxYMin = -2, boxYMax = 2;
        const boxZMin = 0, boxZMax = 7;

        // Grid lines material
        const gridLineMat = new THREE.LineBasicMaterial({ color: 0xc8c8c8, transparent: true, opacity: 0.7 });
        const boxFrameMat = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 1.5 });

        const gridGroup = new THREE.Group();
        plotGroup.add(gridGroup);

        // Back Wall Grid (XZ plane at Y_math = max = 2 -> Three Z = -2)
        for (let z = boxZMin; z <= boxZMax; z += 1) {
            const points = [new THREE.Vector3(boxXMin, z, -boxYMax), new THREE.Vector3(boxXMax, z, -boxYMax)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }
        for (let x = boxXMin; x <= boxXMax; x += 1) {
            const points = [new THREE.Vector3(x, boxZMin, -boxYMax), new THREE.Vector3(x, boxZMax, -boxYMax)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }

        // Side Wall Grid (YZ plane at X_math = min = -2 -> Three X = -2)
        for (let z = boxZMin; z <= boxZMax; z += 1) {
            const points = [new THREE.Vector3(boxXMin, z, -boxYMin), new THREE.Vector3(boxXMin, z, -boxYMax)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }
        for (let y = boxYMin; y <= boxYMax; y += 1) {
            const points = [new THREE.Vector3(boxXMin, boxZMin, -y), new THREE.Vector3(boxXMin, boxZMax, -y)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }

        // Floor Grid (XY plane at Z_math = 0 -> Three Y = 0)
        for (let x = boxXMin; x <= boxXMax; x += 1) {
            const points = [new THREE.Vector3(x, 0, -boxYMin), new THREE.Vector3(x, 0, -boxYMax)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }
        for (let y = boxYMin; y <= boxYMax; y += 1) {
            const points = [new THREE.Vector3(boxXMin, 0, -y), new THREE.Vector3(boxXMax, 0, -y)];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geom, gridLineMat));
        }

        // Main Box Bounding Edges
        const boxEdges = [
            // Vertical Pillars
            [new THREE.Vector3(boxXMin, boxZMin, -boxYMin), new THREE.Vector3(boxXMin, boxZMax, -boxYMin)],
            [new THREE.Vector3(boxXMin, boxZMin, -boxYMax), new THREE.Vector3(boxXMin, boxZMax, -boxYMax)],
            [new THREE.Vector3(boxXMax, boxZMin, -boxYMax), new THREE.Vector3(boxXMax, boxZMax, -boxYMax)],
            // Floor Edges
            [new THREE.Vector3(boxXMin, boxZMin, -boxYMin), new THREE.Vector3(boxXMax, boxZMin, -boxYMin)],
            [new THREE.Vector3(boxXMin, boxZMin, -boxYMin), new THREE.Vector3(boxXMin, boxZMin, -boxYMax)],
            [new THREE.Vector3(boxXMax, boxZMin, -boxYMin), new THREE.Vector3(boxXMax, boxZMin, -boxYMax)],
            [new THREE.Vector3(boxXMin, boxZMin, -boxYMax), new THREE.Vector3(boxXMax, boxZMin, -boxYMax)],
            // Top Edges
            [new THREE.Vector3(boxXMin, boxZMax, -boxYMin), new THREE.Vector3(boxXMin, boxZMax, -boxYMax)],
            [new THREE.Vector3(boxXMin, boxZMax, -boxYMax), new THREE.Vector3(boxXMax, boxZMax, -boxYMax)]
        ];

        boxEdges.forEach(pts => {
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            gridGroup.add(new THREE.Line(geom, boxFrameMat));
        });

        // --- 2D Canvas Labels (Text Sprite Generator) ---
        function createTextSprite(text, fontColor = '#222222', fontSize = 28, isBold = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 128;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = `${isBold ? 'Bold ' : ''}${fontSize}px Inter, sans-serif`;
            ctx.fillStyle = fontColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(1.8, 0.9, 1);
            return sprite;
        }

        // Add Axis Title Labels
        const labelX = createTextSprite('Eje X', '#111111', 32, true);
        labelX.position.set(0, -0.6, -boxYMin + 0.8);
        plotGroup.add(labelX);

        const labelY = createTextSprite('Eje Y', '#111111', 32, true);
        labelY.position.set(-boxXMin - 0.8, -0.6, 0);
        plotGroup.add(labelY);

        const labelZ = createTextSprite('Eje Z', '#111111', 32, true);
        labelZ.position.set(-boxXMin - 0.9, 3.5, -boxYMax);
        plotGroup.add(labelZ);

        // Add Tick Value Labels
        // X Axis Ticks (-1, 0, 1, 2)
        [-1, 0, 1, 2].forEach(val => {
            const tick = createTextSprite(val.toString(), '#444444', 24);
            tick.position.set(val, -0.4, -boxYMin + 0.2);
            tick.scale.set(1.2, 0.6, 1);
            plotGroup.add(tick);
        });

        // Y Axis Ticks (-1, 0, 1, 2)
        [-1, 0, 1, 2].forEach(val => {
            const tick = createTextSprite(val.toString(), '#444444', 24);
            tick.position.set(boxXMin - 0.3, -0.4, -val);
            tick.scale.set(1.2, 0.6, 1);
            plotGroup.add(tick);
        });

        // Z Axis Ticks (0 to 7)
        for (let val = 0; val <= 7; val++) {
            const tick = createTextSprite(val.toString(), '#444444', 22);
            tick.position.set(boxXMin - 0.4, val, -boxYMax);
            tick.scale.set(1.0, 0.5, 1);
            plotGroup.add(tick);
        }

        // --- Interactive Controls ---
        let isAutoRotating = false;

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(11, 10, 12);
            controls.target.set(0, 0, 3.5);
            controls.update();
        });

        document.getElementById('btn-wireframe').addEventListener('click', () => {
            cylinder.material.wireframe = !cylinder.material.wireframe;
            cone.material.wireframe = !cone.material.wireframe;
        });

        document.getElementById('btn-rotate').addEventListener('click', (e) => {
            isAutoRotating = !isAutoRotating;
            e.target.classList.toggle('bg-slate-800');
            e.target.classList.toggle('text-white');
        });

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isAutoRotating) {
                plotGroup.rotation.y += 0.008;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start Animation on load
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
